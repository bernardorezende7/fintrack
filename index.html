
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack | Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>FinTrack</h1>
        <p>Seu dinheiro sob controle.</p>
    </header>

    <main>
        <section id="resumo">
            <h2>Resumo financeiro</h2>

            <div class="cards">
                <article class="card">
                    <h3>Saldo atual</h3>
                    <p id="saldo">R$ 0,00</p>
                </article>

                <article class="card">
                    <h3>Receitas</h3>
                    <p id="receitas">R$ 0,00</p>
                </article>

                <article class="card">
                    <h3>Despesas</h3>
                    <p id="despesas">R$ 0,00</p>
                </article>
            </div>
        </section>

        <section id="nova-movimentacao">
            <h2>Nova movimentação</h2>

            <form id="form-movimentacao">
                <label for="descricao">Descrição</label>
                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex.: Salário"
                    required
                >

                <label for="valor">Valor (R$)</label>
                <input
                    type="number"
                    id="valor"
                    min="0.01"
                    step="0.01"
                    placeholder="Ex.: 150.00"
                    required
                >

                <label for="tipo">Tipo</label>
                <select id="tipo" required>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>

                <button type="submit">Adicionar movimentação</button>
            </form>
        </section>

        <section id="historico">
            <h2>Histórico</h2>
            <ul id="lista-movimentacoes">
                <li>Nenhuma movimentação cadastrada.</li>
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
